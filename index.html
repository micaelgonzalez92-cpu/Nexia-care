<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexia Care — Diagnóstico</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#0b1020;color:#eef2ff}
.card{background:#151c33;border:1px solid #2b365d;border-radius:18px;padding:24px}
button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;background:#536dfe;color:white;font-weight:700;cursor:pointer}.status{padding:12px;border:1px solid #2b365d;border-radius:12px;margin:12px 0;color:#cbd4f4;font-size:14px}
.muted{color:#aab4d6}.hidden{display:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#263052;margin-bottom:12px}.hud{margin:14px 0 20px}.hudrow{display:flex;justify-content:space-between;font-size:12px;color:#aab4d6;margin-bottom:7px}.bar{height:10px;background:#252e4d;border-radius:999px;overflow:hidden}.fill{height:100%;background:#536dfe;border-radius:999px;transition:width .25s ease}.xp{margin-top:8px;font-size:12px;color:#aab4d6}
</style>
</head>
<body>
<div class="card">
<div class="tag">Nexia Care · MVP 0.5</div>
<h1>¿Qué le ocurre a tu De’Longhi Magnifica?</h1>
<p class="muted">Responde unas preguntas y te diremos qué comprobar antes de gastar dinero.</p>
<div id="app"></div>
</div>
<script>
const app=document.getElementById('app');
const state={model:null,symptom:null,answers:{}};
function progress(){
 const q=state.symptom===null?null:{0:'flow',1:'descaled',2:'all',3:'hot',5:'descaled',6:'location',8:'grounds'}[state.symptom];
 const complete=state.symptom!==null && (!q || state.answers[q]!==undefined);
 return complete?3:state.model?2:1
}
function hud(){const p=progress();return '<div class="hud"><div class="hudrow"><span>PROGRESO DE MISIÓN</span><strong>'+p+'/3</strong></div><div class="bar"><div class="fill" style="width:'+(p/3*100)+'%"></div></div><div class="xp">Nexia Care · diagnóstico en curso</div></div>'}
function render(){
 const h=hud();
 if(!state.model){app.innerHTML=h+'<h2>1. Tu modelo</h2><button onclick="pickModel(\'ECAM21/22.110\')">Magnifica S · ECAM21/22.110</button><button onclick="pickModel(\'unknown\')">No lo sé</button>';return}
 if(state.symptom===null){app.innerHTML=h+'<h2>2. ¿Qué ocurre?</h2>'+['No sale café','Sale muy poco / gotea','Café aguado','Café frío','No hace espuma','Luz CALC','Fuga de agua','Alarma / no sé qué ocurre','Triángulo rojo / aviso de posos'].map((x,i)=>'<button onclick="pickSymptom('+i+')">'+x+'</button>').join('');return}
 const s=state.symptom;
 const q={0:['¿La máquina hace ruido al preparar café?','flow'],1:['¿La has descalcificado recientemente?','descaled'],2:['¿El café sale aguado en todas las preparaciones?','all'],3:['¿También salen fríos el agua caliente o el vapor?','hot'],5:['¿La has descalcificado recientemente?','descaled'],6:['¿Puedes identificar claramente de dónde sale el agua?','location'],8:['¿Has retirado y vuelto a colocar correctamente el recipiente de posos y la bandeja de goteo?','grounds']}[s];
 if(q && state.answers[q[1]]===undefined){app.innerHTML=h+'<h2>3. Comprobación</h2><p>'+q[0]+'</p><button onclick="answer(\''+q[1]+'\',\'yes\')">Sí</button><button onclick="answer(\''+q[1]+'\',\'no\')">No / no lo sé</button>';return}
 const advice=[
 state.answers.flow==='no'?'Comprueba que el depósito tenga agua y esté bien colocado. Si la máquina sigue sin entregar café, no fuerces piezas y pasa a servicio técnico.':'Comprueba primero el ajuste de molienda: si está demasiado fino, la máquina puede entregar el café muy lentamente o no entregarlo. En este modelo, corrige el molinillo un clic hacia 7 mientras está moliendo y prueba al menos 2 cafés. Si no sale café por uno o ambos surtidores, comprueba también si están obstruidos y límpialos con un palillo; si persiste, escala el diagnóstico.',
 'Si el café sale muy lentamente o gotea, comprueba el ajuste de molienda antes de comprar piezas. En este modelo, una molienda demasiado fina puede restringir el flujo; corrige un clic hacia 7 mientras muele y prueba al menos 2 cafés. Si persiste, continúa con las comprobaciones de limpieza/mantenimiento y no compres piezas a ciegas.',
 'Si el café resulta aguado o poco cremoso, comprueba primero la molienda. El manual indica que una molienda demasiado gruesa puede producir café débil o poco cremoso: ajusta un clic hacia 1 mientras el molinillo está funcionando y prueba al menos 2 cafés antes de volver a ajustar. Si el problema continúa, revisa que el café sea adecuado para máquinas espresso y pasa al siguiente diagnóstico.',
 'Para café frío, prueba primero a calentar la taza con agua caliente y a realizar un enjuague/puesta a temperatura antes de preparar el café. Si también salen fríos el agua caliente o el vapor, o el problema persiste tras estas comprobaciones, escala a servicio técnico.',
 'Si no hace espuma, limpia el cappuccino maker y comprueba que sus orificios no estén obstruidos y que esté correctamente montado. Si la espuma tiene burbujas grandes, usa leche fría de frigorífico (aprox. 5 °C), preferiblemente desnatada o semidesnatada.',
 'Si la luz CALC está encendida o parpadea, realiza la descalcificación siguiendo el procedimiento indicado por De’Longhi. Si acabas de descalcificar y la máquina vuelve a pedirla, revisa que el ciclo se haya completado correctamente antes de repetirlo. No compres piezas por este aviso.',
 'La ubicación de la fuga cambia el diagnóstico. Primero identifica si el agua procede del depósito, bandeja, surtidores o interior. Si la fuga parece interna, es abundante o afecta a la zona eléctrica, apaga y desconecta la máquina y pasa a servicio técnico. No desmontes ni compres una pieza sin identificar el origen.',
 'Necesitamos una comprobación adicional. Como mínimo, comprueba depósito y bandeja, recipiente de posos, grupo y surtidores sin forzar ni desmontar piezas. Si el aviso persiste o no puedes identificar la causa, pasa a servicio técnico.',
 state.answers.grounds==='no'?'Retira y vuelve a colocar correctamente la bandeja de goteo y el recipiente de posos, comprueba que estén completamente insertados y reinicia la máquina. Si el aviso persiste, no fuerces ni desmontes sensores: pasa a una comprobación del grupo y, si sigue igual, a servicio técnico.':'El triángulo rojo no identifica por sí solo una única avería. Si bandeja y recipiente están correctamente colocados y el aviso persiste, no compres piezas a ciegas: revisa grupo y limpieza y, si sigue igual, pasa a servicio técnico.'
 ][state.symptom];
 app.innerHTML=h+'<h2>Resultado</h2><div class="status"><strong>Primera acción recomendada</strong><br>'+advice+'</div><p class="muted">Modelo: '+(state.model==='unknown'?'no identificado':state.model)+'</p><p class="muted">No compres piezas todavía. Si esta comprobación no resuelve el problema, el siguiente paso debe basarse en el síntoma observado o en servicio técnico, no en una compra a ciegas.</p><button onclick="reset()">Empezar de nuevo</button>';
}
function pickModel(x){state.model=x;render()}
function pickSymptom(x){state.symptom=x;render()}
function answer(k,v){state.answers[k]=v;render()}
function reset(){state.model=null;state.symptom=null;state.answers={};render()}
render();
</script>
</body>
</html>

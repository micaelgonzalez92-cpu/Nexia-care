<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexaCare — Diagnóstico</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#0b1020;color:#eef2ff}
.card{background:#151c33;border:1px solid #2b365d;border-radius:18px;padding:24px}
button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;background:#536dfe;color:white;font-weight:700;cursor:pointer}.command{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.command button{margin:0;background:#202a49}.status{padding:12px;border:1px solid #2b365d;border-radius:12px;margin:12px 0;color:#cbd4f4;font-size:14px}
.muted{color:#aab4d6}.hidden{display:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#263052;margin-bottom:12px}.hud{margin:14px 0 20px}.hudrow{display:flex;justify-content:space-between;font-size:12px;color:#aab4d6;margin-bottom:7px}.bar{height:10px;background:#252e4d;border-radius:999px;overflow:hidden}.fill{height:100%;background:#536dfe;border-radius:999px;transition:width .25s ease}.xp{margin-top:8px;font-size:12px;color:#aab4d6}
</style>
</head>
<body>
<div class="card">
<div class="tag">NexaCare · MVP 0.4 · EXP-001B</div><div class="command"><button onclick="command('mission')">🎯 MISIÓN</button><button onclick="command('report')">📊 INFORME</button><button onclick="command('economy')">💰 ECONOMÍA</button><button onclick="command('tasks')">👤 MIS TAREAS</button></div><div id="command"></div>
<h1>Vamos a intentar resolverlo antes de gastar dinero</h1>
<p class="muted">Haz solo comprobaciones seguras y reversibles. No desmontes la máquina ni compres piezas durante esta prueba.</p>
<div id="app"></div>
</div>
<script>
const app=document.getElementById('app'); const commandBox=document.getElementById('command');
const state={model:null,symptom:null,answers:{},step:0};
function command(x){const messages={mission:"🎯 MISIÓN ACTUAL: completar el diagnóstico sin comprar piezas a ciegas.",report:"📊 INFORME: MVP 0.3 · validación · €0 gastados · 0 extracciones.",economy:"💰 ECONOMÍA: capital gastado €0 · inventario €0 · ingresos €0 · beneficio €0.",tasks:"👤 TAREAS: ninguna imprescindible ahora."};commandBox.innerHTML='<div class="status">'+messages[x]+'</div>'}
function progress(){return state.symptom?3:state.model?2:1}
function hud(){const p=progress();return '<div class="hud"><div class="hudrow"><span>PROGRESO DE MISIÓN</span><strong>'+p+'/3</strong></div><div class="bar"><div class="fill" style="width:'+(p/3*100)+'%"></div></div><div class="xp">NexaCare · diagnóstico en curso</div></div>'}
function render(){
 const h=hud();
 if(!state.model){app.innerHTML=h+'<h2>1. Tu modelo</h2><button onclick="pickModel(\'ECAM21/22.110\')">Magnifica S · ECAM21/22.110</button><button onclick="pickModel(\'unknown\')">No lo sé</button>';return}
 if(!state.symptom){app.innerHTML=h+'<h2>2. ¿Qué problema quieres resolver?</h2>'+['No sale café','Sale muy poco / gotea','Café aguado / sin cuerpo','Café frío','No hace espuma','Luz CALC','Fuga de agua','Alarma / otro problema'].map((x,i)=>'<button onclick="pickSymptom('+i+')">'+x+'</button>').join('');return}
 const s=state.symptom;
 const qs={0:[['¿La máquina hace ruido al preparar café?','noise'],['¿El depósito tiene agua y está bien colocado?','water']],1:[['¿El café sale muy lentamente o solo en gotas durante prácticamente toda la extracción?','slow'],['¿La molienda está en un ajuste muy fino?','fine']],2:[['¿El problema ocurre también usando otro café en grano adecuado para superautomática?','bean'],['¿La intensidad/aroma está ajustada hacia una cantidad alta de café?','dose']],3:[['¿También salen fríos el agua caliente o el vapor?','hot']],4:[['¿La boquilla/sistema de leche está limpio y correctamente montado?','milk']],5:[['¿Has completado recientemente el ciclo de descalcificación indicado para la máquina?','descaled']],6:[['¿Puedes localizar claramente de dónde sale el agua?','location']],7:[['¿La máquina muestra luces o un patrón de aviso concreto?','warning']]}[s]||[]; const q=qs[state.step];
 if(q && state.answers[q[1]]===undefined){app.innerHTML=h+'<h2>3. Comprobación</h2><p>'+q[0]+'</p><button onclick="answer(\''+q[1]+'\',\'yes\')">Sí</button><button onclick="answer(\''+q[1]+'\',\'no\')">No / no lo sé</button>';return}
 const d=diagnose(s,state.answers); const advice=d.a;
 state.answers.flow==='no'?'Comprueba depósito, agua y circuito. Si sigue sin bombear, servicio técnico.':'Comprueba suministro y limpieza. Si el agua circula pero no sale café, revisa grupo y molienda antes de comprar.',
 'Primero descalcificación y limpieza del grupo. Si persiste, revisar molienda/configuración antes de comprar piezas.',
 'Comprueba molienda, limpieza y mantenimiento. Si el problema aparece en todas las tazas, pasa al siguiente diagnóstico.',
 'Comprueba si también están fríos el agua y el vapor. Si hay avisos o no recupera temperatura, servicio técnico.',
 'Comprueba limpieza del sistema de leche y que el circuito esté correctamente montado.',
 'Si hace tiempo que no descalcificas, empieza por mantenimiento. Si ya lo hiciste recientemente, revisa el procedimiento antes de comprar.',
 'La ubicación de la fuga cambia completamente el diagnóstico. No compres una pieza sin identificar el punto de fuga.',
 'Necesitamos una comprobación adicional. Mejor servicio que comprar una pieza por intuición.'
 ][state.symptom];
 app.innerHTML=h+'<h2>Primera acción</h2><p><strong>'+d.t+'</strong></p><p>'+d.a+'</p><p class="muted">Después: '+d.v+'</p>'+(d.stop?'<div class="status">⛔ '+d.stop+'</div>':'')+'<button onclick="solved()">✅ Se ha solucionado</button><button onclick="notSolved()">❌ No se ha solucionado</button><button onclick="reset()">Empezar de nuevo</button>';
}
function diagnose(s,a){if(s===0)return a.noise==='no'?{t:'Comprueba primero el suministro de agua.',a:'Llena y recoloca el depósito; realiza un ciclo de agua caliente. Si no sale agua, no compres piezas.',v:'¿Ahora sale agua y después café?',stop:'Si no circula agua, detente y pasa a servicio técnico.'}:{t:'Descarta agua/circuito y atasco por molienda.',a:'Comprueba depósito y salida. Si el agua circula pero no sale café, no cambies ajustes al azar.',v:'Haz una preparación corta y observa el flujo.',stop:'Ante ruidos anómalos o bloqueo, detente.'};if(s===1)return a.slow==='yes'||a.fine==='yes'?{t:'No fuerces una molienda excesivamente fina.',a:'Prueba un ajuste algo más grueso y cambia solo una variable. No gires el molino mientras está parado.',v:'Compara una taza corta antes/después.',stop:'Si sigue goteando o se atasca, no desmontes.'}:{t:'Primero mide el síntoma.',a:'Haz una taza corta y observa si el goteo dura toda la extracción. Registra el resultado antes de cambiar otra cosa.',v:'¿Mejora con una sola modificación?',stop:'No compres bomba, grupo o molino sin diagnóstico.'};if(s===2)return{t:'Prueba una sola variable de extracción.',a:'Mantén el mismo café y aumenta moderadamente la intensidad/dosis. Si sigue aguado, prueba después una molienda ligeramente más fina, una variable cada vez.',v:'Compara dos tazas consecutivas.',stop:'Si no mejora, no compres piezas todavía.'};if(s===3)return a.hot==='yes'?{t:'Puede ser un problema de calentamiento.',a:'Si también están fríos agua y vapor, deja de ajustar molienda y registra el comportamiento para servicio técnico.',v:'Comprueba si agua y vapor recuperan temperatura.',stop:'No desmontes la máquina.'}:{t:'Descarta circuito/taza fría.',a:'Haz un ciclo de agua caliente para calentar circuito y taza y después una taza corta.',v:'¿La segunda taza mejora?',stop:'Si sigue fría persistentemente, requiere diagnóstico adicional.'};if(s===4)return{t:'Limpia y vuelve a montar el sistema de leche.',a:'Limpia salidas y conductos accesibles según fabricante y verifica obstrucciones visibles.',v:'Prueba vapor/espuma después.',stop:'No desmontes componentes internos.'};if(s===5)return a.descaled==='no'?{t:'Realiza la descalcificación indicada.',a:'Sigue el procedimiento del fabricante; no mezcles productos.',v:'¿Desaparece CALC?',stop:'Si el ciclo no completa, detente.'}:{t:'Verifica que el ciclo CALC terminó correctamente.',a:'Comprueba que depósito y ciclo quedaron correctamente completados.',v:'¿Desaparece el aviso?',stop:'No fuerces reinicios.'};if(s===6)return a.location==='yes'?{t:'Identifica el punto exacto de fuga.',a:'Seca la zona exterior y observa durante una preparación dónde reaparece el agua; no desmontes.',v:'¿Puedes señalar el punto exacto?',stop:'Si procede del interior/cerca de electricidad, desenchufa y no uses la máquina.'}:{t:'Localiza la fuga sin desmontar.',a:'Seca bandeja y exterior y observa durante un ciclo.',v:'¿Dónde reaparece el agua?',stop:'Si hay agua cerca de electricidad, desenchufa.'};return{t:'Captura el síntoma exacto.',a:'Anota luces, sonidos y qué ocurre justo antes del fallo. No compres piezas por intuición.',v:'Ese dato decide el siguiente árbol.',stop:'Ante humo, olor a quemado o riesgo eléctrico, desenchufa.'};}
function pickModel(x){state.model=x;render()}
function pickSymptom(x){state.symptom=x;render()}
function answer(k,v){state.answers[k]=v;render()}
function solved(){app.innerHTML=hud()+'<h2>🎉 Resultado: resuelto</h2><p>Esta prueba ha generado evidencia de utilidad real. Anota qué paso solucionó el problema.</p><button onclick="reset()">Nuevo diagnóstico</button>}\nfunction notSolved(){app.innerHTML=hud()+'<h2>🔎 Resultado: no resuelto</h2><p>No es un fracaso: necesitamos el siguiente dato. Anota modelo, síntoma, pasos y resultado.</p><button onclick="reset()">Nuevo diagnóstico</button>}\nfunction reset(){state.model=null;state.symptom=null;state.answers={};state.step=0;render()}
render();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexaCare — Diagnóstico</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#0b1020;color:#eef2ff}
.card{background:#151c33;border:1px solid #2b365d;border-radius:18px;padding:24px}
button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;background:#536dfe;color:white;font-weight:700;cursor:pointer}.command{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.command button{margin:0;background:#202a49}.status{padding:12px;border:1px solid #2b365d;border-radius:12px;margin:12px 0;color:#cbd4f4;font-size:14px}
.muted{color:#aab4d6}.hidden{display:none}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#263052;margin-bottom:12px}.hud{margin:14px 0 20px}.hudrow{display:flex;justify-content:space-between;font-size:12px;color:#aab4d6;margin-bottom:7px}.bar{height:10px;background:#252e4d;border-radius:999px;overflow:hidden}.fill{height:100%;background:#536dfe;border-radius:999px;transition:width .25s ease}.xp{margin-top:8px;font-size:12px;color:#aab4d6}
</style>
</head>
<body>
<div class="card">
<div class="tag">NexaCare · MVP 0.4</div><div class="command"><button onclick="command('mission')">🎯 MISIÓN</button><button onclick="command('report')">📊 INFORME</button><button onclick="command('economy')">💰 ECONOMÍA</button><button onclick="command('tasks')">👤 MIS TAREAS</button></div><div id="command"></div>
<h1>¿Qué le ocurre a tu De’Longhi Magnifica?</h1>
<p class="muted">Responde unas preguntas y te diremos qué comprobar antes de gastar dinero.</p>
<div id="app"></div>
</div>
<script>
const app=document.getElementById('app'); const commandBox=document.getElementById('command');
const state={model:null,symptom:null,answers:{}};
function command(x){const messages={mission:"🎯 MISIÓN ACTUAL: completar el diagnóstico sin comprar piezas a ciegas.",report:"📊 INFORME: MVP 0.4 · validación · €0 gastados · evidencia pública incorporada.",economy:"💰 ECONOMÍA: capital gastado €0 · inventario €0 · ingresos €0 · beneficio €0.",tasks:"👤 TAREAS: ninguna imprescindible ahora."};commandBox.innerHTML='<div class="status">'+messages[x]+'</div>'}
function progress(){return state.symptom!==null?3:state.model?2:1}
function hud(){const p=progress();return '<div class="hud"><div class="hudrow"><span>PROGRESO DE MISIÓN</span><strong>'+p+'/3</strong></div><div class="bar"><div class="fill" style="width:'+(p/3*100)+'%"></div></div><div class="xp">NexaCare · diagnóstico en curso</div></div>'}
function render(){
 const h=hud();
 if(!state.model){app.innerHTML=h+'<h2>1. Tu modelo</h2><button onclick="pickModel(\'ECAM21/22.110\')">Magnifica S · ECAM21/22.110</button><button onclick="pickModel(\'unknown\')">No lo sé</button>';return}
 if(state.symptom===null){app.innerHTML=h+'<h2>2. ¿Qué ocurre?</h2>'+['No sale café','Sale muy poco / gotea','Café aguado','Café frío','No hace espuma','Luz CALC','Fuga de agua','Alarma / no sé qué ocurre','Triángulo rojo / aviso de posos'].map((x,i)=>'<button onclick="pickSymptom('+i+')">'+x+'</button>').join('');return}
 const s=state.symptom;
 const q={0:['¿La máquina hace ruido al preparar café?','flow'],1:['¿La has descalcificado recientemente?','descaled'],2:['¿El café sale aguado en todas las preparaciones?','all'],3:['¿También salen fríos el agua caliente o el vapor?','hot'],5:['¿La has descalcificado recientemente?','descaled'],6:['¿Puedes identificar claramente de dónde sale el agua?','location'],8:['¿Has retirado y vuelto a colocar correctamente el recipiente de posos y la bandeja de goteo?','grounds']}[s];
 if(q && state.answers[q[1]]===undefined){app.innerHTML=h+'<h2>3. Comprobación</h2><p>'+q[0]+'</p><button onclick="answer(\''+q[1]+'\',\'yes\')">Sí</button><button onclick="answer(\''+q[1]+'\',\'no\')">No / no lo sé</button>';return}
 const advice=[
 state.answers.flow==='no'?'Comprueba depósito, agua y circuito. Si sigue sin bombear, servicio técnico.':'Comprueba suministro y limpieza. Si el agua circula pero no sale café, revisa grupo y molienda antes de comprar.',
 'Primero descalcificación y limpieza del grupo. Si persiste, revisar molienda/configuración antes de comprar piezas.',
 'Comprueba molienda, limpieza y mantenimiento. Si el problema aparece en todas las tazas, pasa al siguiente diagnóstico.',
 'Comprueba si también están fríos el agua y el vapor. Si hay avisos o no recupera temperatura, servicio técnico.',
 'Comprueba limpieza del sistema de leche y que el circuito esté correctamente montado.',
 'Si hace tiempo que no descalcificas, empieza por mantenimiento. Si ya lo hiciste recientemente, revisa el procedimiento antes de comprar.',
 'La ubicación de la fuga cambia completamente el diagnóstico. No compres una pieza sin identificar el punto de fuga.',
 'Necesitamos una comprobación adicional. Mejor servicio que comprar una pieza por intuición.',
 state.answers.grounds==='no'?'Retira y vuelve a colocar correctamente la bandeja de goteo y el recipiente de posos, comprueba que estén completamente insertados y reinicia la máquina. Si el aviso persiste, no fuerces ni desmontes sensores: el siguiente paso es comprobar el grupo y los microinterruptores mediante servicio técnico.':'Si el recipiente de posos y la bandeja están correctamente colocados pero el triángulo rojo sigue apareciendo, no compres piezas a ciegas. Revisa primero grupo, limpieza y posibles sensores/microinterruptores; si persiste, servicio técnico.'
 ][state.symptom];
 app.innerHTML=h+'<h2>3. Primera acción</h2><p>'+advice+'</p><p class="muted">Modelo: '+state.model+'</p><button onclick="reset()">Empezar de nuevo</button>';
}
function pickModel(x){state.model=x;render()}
function pickSymptom(x){state.symptom=x;render()}
function answer(k,v){state.answers[k]=v;render()}
function reset(){state.model=null;state.symptom=null;state.answers={};render()}
render();
</script>
</body>
</html>

name: Nexia CI

on:
  push:
    branches: [main]
    paths:
      - 'prototypes/**'
      - 'products/**'
      - 'tools/**'
      - 'NEXIA_STATE.json'
      - 'NEXIA_BOOT.json'
      - 'NEXIA_LIVE.json'
      - 'NEXIA_EVENT_INDEX*.json'
      - 'NEXIA_LOCAL_WORKER_*.json'
      - 'NEXIA_MASTER_BACKUP.md'
      - 'events/**'
      - '.github/workflows/nexia-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/**'
      - 'products/**'
      - 'tools/**'
      - 'NEXIA_STATE.json'
      - 'NEXIA_BOOT.json'
      - 'NEXIA_LIVE.json'
      - 'NEXIA_EVENT_INDEX*.json'
      - 'NEXIA_LOCAL_WORKER_*.json'
      - 'NEXIA_MASTER_BACKUP.md'
      - 'events/**'
      - '.github/workflows/nexia-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lead intake logic suite
        run: node prototypes/test-lead-intake-reliability-demo.js

      - name: Local HTTP integration suite
        run: node prototypes/test_http_runtime.js

      - name: Huescaventura domain suite
        run: node prototypes/test_huescaventura_logic.js

      - name: Validate Node-RED flow structure
        run: node prototypes/validate_node_red_flow.js prototypes/node-red-exp-auto-001-flow.json

      - name: Validate n8n import skeleton
        run: node prototypes/validate_n8n_huescaventura_demo.js prototypes/n8n-huescaventura-intake-demo.json

      - name: Validate internal Lead Intake Reliability Kit
        run: node products/lead-intake-reliability-kit/test_product.js

      - name: Integrity checker regression tests
        run: python3 tools/test_nexia_integrity_check.py

      - name: Zero-quota execution router tests
        run: python3 tools/test_nexia_execution_router.py

      - name: Local worker safety regression tests
        run: |
          python3 -m py_compile tools/nexia_local_worker_v0_1.py
          python3 tools/test_nexia_local_worker_v0_1.py

      - name: Local worker PowerShell transport syntax
        shell: pwsh
        run: |
          $files = @('tools/run_nexia_local_worker_cycle_v0_1.ps1','tools/manage_nexia_local_worker_v0_1.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }
            if ($file -eq 'tools/manage_nexia_local_worker_v0_1.ps1') {
              $shadowAssignments = $ast.FindAll({
                param($node)
                $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and
                $node.Left -is [System.Management.Automation.Language.VariableExpressionAst] -and
                $node.Left.VariablePath.UserPath -ieq 'Action'
              }, $true)
              if ($shadowAssignments.Count -gt 0) {
                Write-Error 'manage_nexia_local_worker_v0_1.ps1 must not assign to the validated Action parameter.'
                exit 1
              }
            }
          }

      - name: Local worker GitHub fail-closed regression
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(-not (Get-Command gh -ErrorAction SilentlyContinue)){ throw 'gh CLI unavailable on runner.' }
          $root = Join-Path $env:RUNNER_TEMP 'nexia-failclosed-ci'
          $bin = Join-Path $root 'bin'
          $fakeBin = Join-Path $root 'fakebin'
          New-Item -ItemType Directory -Force -Path $bin,$fakeBin | Out-Null
          Copy-Item 'tools/nexia_local_worker_v0_1.py' (Join-Path $bin 'nexia_local_worker_v0_1.py')
          Copy-Item 'tools/run_nexia_local_worker_cycle_v0_1.ps1' (Join-Path $bin 'run_nexia_local_worker_cycle_v0_1.ps1')

          @'
          {
            "schema_version": 1,
            "tasks": [
              {
                "task_id": "FAILCLOSED-CACHED-CI-001",
                "action": "HEALTH_CHECK",
                "authority": "GREEN_INTERNAL",
                "external_effects": false,
                "status": "READY",
                "payload": {}
              }
            ]
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $root 'queue.remote.json')

          $pythonCalled = Join-Path $root 'python-called.txt'
          $env:NEXIA_FAKE_PYTHON_CALLED = $pythonCalled
          $fakePython = Join-Path $fakeBin 'python'
          @'
          #!/usr/bin/env bash
          touch "$NEXIA_FAKE_PYTHON_CALLED"
          exit 99
          '@ | Set-Content -Encoding utf8 $fakePython
          & chmod +x $fakePython
          $env:PATH = "$fakeBin$([IO.Path]::PathSeparator)$env:PATH"

          $cycle = Join-Path $bin 'run_nexia_local_worker_cycle_v0_1.ps1'
          & pwsh -NoProfile -File $cycle -Repo 'micaelgonzalez92-cpu/NEXIA-REPO-THAT-MUST-NOT-EXIST-FAILCLOSED-CI' -Branch main -BaseDir $root
          $code = $LASTEXITCODE

          if($code -eq 0){ throw 'Fail-closed regression: transport failure returned exit code 0.' }
          if(Test-Path (Join-Path $root 'status.json')){ throw 'Fail-closed regression: status.json was created.' }
          if(Test-Path (Join-Path $root 'state/ledger.json')){ throw 'Fail-closed regression: ledger.json was created.' }
          if(Test-Path $pythonCalled){ throw 'Fail-closed regression: worker Python process was launched despite GitHub fetch failure.' }
          Write-Host 'FAIL_CLOSED_GITHUB_CI: PASS'
          exit 0

      - name: Local coder benchmark harness syntax
        run: python3 -m py_compile tools/nexia_local_ai_coder_001_benchmark.py

      - name: Local coder PowerShell runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/run_local_ai_coder_001.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: UGC video runner syntax and bounded prompt contract
        shell: bash
        run: |
          python3 -m py_compile tools/run_ugc_video_001.py
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('ugcvideo', 'tools/run_ugc_video_001.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          prompt = module.build_prompt(4201)
          assert module.SEEDS == [4201, 4202, 4203]
          assert module.MODEL_CHECKPOINT == 'ltx-video-2b-v0.9.5.safetensors'
          assert module.MODEL_TEXT_ENCODER == 't5xxl_fp16.safetensors'
          assert prompt['77']['inputs']['width'] == 512
          assert prompt['77']['inputs']['height'] == 768
          assert prompt['77']['inputs']['length'] == 97
          assert prompt['72']['inputs']['noise_seed'] == 4201
          assert prompt['80']['inputs']['fps'] == 24.0
          assert prompt['81']['inputs']['format'] == 'auto'
          assert module.BASE_URL == 'http://127.0.0.1:8188'
          PY

      - name: UGC video PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/run_ugc_video_001.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Canonical STATE BOOT LIVE integrity check
        shell: bash
        run: |
          set +e
          python3 tools/nexia_integrity_check.py --json
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo 'Canonical integrity check found one or more errors.'
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo 'Canonical integrity check contains warnings only; warnings remain visible and do not fail CI.'
          fi
          exit 0

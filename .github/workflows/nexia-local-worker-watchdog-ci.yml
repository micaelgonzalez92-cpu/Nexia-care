name: Nexia Local Worker Watchdog CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_nexia_local_worker_watchdog_v0_1.ps1'
      - 'tools/test_nexia_local_worker_watchdog_retry.ps1'
      - '.github/workflows/nexia-local-worker-watchdog-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/run_nexia_local_worker_watchdog_v0_1.ps1'
      - 'tools/test_nexia_local_worker_watchdog_retry.ps1'
      - '.github/workflows/nexia-local-worker-watchdog-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate watchdog PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'tools/run_nexia_local_worker_watchdog_v0_1.ps1',
            'tools/test_nexia_local_worker_watchdog_retry.ps1'
          )
          foreach($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }
          }

      - name: Bounded watchdog retry regression
        shell: pwsh
        run: pwsh -NoProfile -File tools/test_nexia_local_worker_watchdog_retry.ps1

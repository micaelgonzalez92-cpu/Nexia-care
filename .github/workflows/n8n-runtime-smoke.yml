name: n8n Runtime Smoke

on:
  push:
    paths:
      - '.github/workflows/n8n-runtime-smoke.yml'
      - 'prototypes/n8n-huescaventura-intake-demo.json'
      - 'prototypes/n8n-huescaventura-runtime-fixture.json'
      - 'prototypes/n8n-datatable-dedup-setup.json'
      - 'prototypes/n8n-datatable-dedup-webhook.json'
      - 'prototypes/n8n-datatable-dedup-audit.json'

permissions:
  contents: read

jobs:
  n8n-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'

      - name: Show n8n version
        run: npx --yes n8n@2.42.6 --version

      - name: Import workflow into ephemeral n8n database
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n-user
        run: |
          mkdir -p "$N8N_USER_FOLDER"
          npx --yes n8n@2.42.6 import:workflow --input=prototypes/n8n-huescaventura-intake-demo.json

      - name: Export imported workflow from n8n
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n-user
          N8N_EXPORT_FILE: ${{ runner.temp }}/n8n-export.json
        run: |
          npx --yes n8n@2.42.6 export:workflow --all --output="$N8N_EXPORT_FILE"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const workflows = JSON.parse(fs.readFileSync(process.env.N8N_EXPORT_FILE, 'utf8'));
          assert.ok(Array.isArray(workflows), 'Export must be a JSON array');
          assert.equal(workflows.length, 1, 'Export must contain exactly one workflow');
          assert.equal(workflows[0].id, 'nexia-exp-auto-001-huescaventura-demo');
          assert.equal(workflows[0].name, 'NEXIA EXP-AUTO-001 Huescaventura Intake Demo');
          console.log('PASS: exactly one expected workflow exported');
          NODE

      - name: Execute EXP-AUTO-001 logic inside real n8n runtime
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n-exec-user
          N8N_EXEC_OUTPUT: ${{ runner.temp }}/n8n-exec-output.json
        run: |
          mkdir -p "$N8N_USER_FOLDER"
          npx --yes n8n@2.42.6 import:workflow --input=prototypes/n8n-huescaventura-runtime-fixture.json
          npx --yes n8n@2.42.6 execute --id=nexia-exp-auto-001-runtime-fixture --rawOutput | tee "$N8N_EXEC_OUTPUT"
          grep -Eq '"pass"[[:space:]]*:[[:space:]]*true' "$N8N_EXEC_OUTPUT"
          grep -Eq '"cases"[[:space:]]*:[[:space:]]*6' "$N8N_EXEC_OUTPUT"
          grep -Eq '"runtime"[[:space:]]*:[[:space:]]*"n8n-code-node"' "$N8N_EXEC_OUTPUT"
          echo 'PASS: EXP-AUTO-001 logic executed inside n8n runtime with 6 asserted synthetic cases'

      - name: Prove persistent deduplication with native n8n Data Tables
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n-datatable-user
          N8N_PORT: '5678'
          N8N_HOST: '127.0.0.1'
          N8N_PROTOCOL: 'http'
          N8N_SECURE_COOKIE: 'false'
          N8N_DIAGNOSTICS_ENABLED: 'false'
          N8N_PERSONALIZATION_ENABLED: 'false'
          N8N_LOG: ${{ runner.temp }}/n8n-datatable.log
          BASE_URL: http://127.0.0.1:5678
          DEDUP_WORKFLOW_ID: nexia-exp-auto-001-datatable-dedup
          DEDUP_WEBHOOK_PATH: nexia-exp-auto-001-datatable-dedup
          AUDIT_OUTPUT: ${{ runner.temp }}/n8n-datatable-audit.json
        run: |
          set -euo pipefail
          mkdir -p "$N8N_USER_FOLDER"

          npx --yes n8n@2.42.6 import:workflow --input=prototypes/n8n-datatable-dedup-setup.json
          npx --yes n8n@2.42.6 import:workflow --input=prototypes/n8n-datatable-dedup-webhook.json
          npx --yes n8n@2.42.6 import:workflow --input=prototypes/n8n-datatable-dedup-audit.json

          npx --yes n8n@2.42.6 execute --id=nexia-exp-auto-001-datatable-setup --rawOutput > "$RUNNER_TEMP/n8n-datatable-setup-output.json"
          grep -q 'nexia_exp_auto_001_dedup_proof' "$RUNNER_TEMP/n8n-datatable-setup-output.json"

          npx --yes n8n@2.42.6 publish:workflow --id="$DEDUP_WORKFLOW_ID"
          DB="$N8N_USER_FOLDER/.n8n/database.sqlite"

          webhook_registered() {
            DB="$DB" DEDUP_WORKFLOW_ID="$DEDUP_WORKFLOW_ID" DEDUP_WEBHOOK_PATH="$DEDUP_WEBHOOK_PATH" python3 <<'PY'
          import os, sqlite3, sys
          con = sqlite3.connect(os.environ['DB'])
          row = con.execute(
              'SELECT workflowId, webhookPath, method FROM webhook_entity WHERE workflowId=? AND webhookPath=? AND method=?',
              (os.environ['DEDUP_WORKFLOW_ID'], os.environ['DEDUP_WEBHOOK_PATH'], 'POST')
          ).fetchone()
          if row:
              print('registered webhook:', row)
              sys.exit(0)
          sys.exit(1)
          PY
          }

          start_n8n() {
            : > "$N8N_LOG"
            npx --yes n8n@2.42.6 start >> "$N8N_LOG" 2>&1 &
            N8N_PID=$!
            for i in $(seq 1 60); do
              if curl -fsS "$BASE_URL/healthz" >/dev/null 2>&1; then break; fi
              sleep 1
            done
            if ! curl -fsS "$BASE_URL/healthz" >/dev/null 2>&1; then
              cat "$N8N_LOG"
              return 1
            fi
            for i in $(seq 1 60); do
              if webhook_registered; then return 0; fi
              sleep 1
            done
            echo 'Webhook registration failed'
            cat "$N8N_LOG"
            return 1
          }

          stop_n8n() {
            if [ -n "${N8N_PID:-}" ] && kill -0 "$N8N_PID" >/dev/null 2>&1; then
              kill "$N8N_PID" || true
              wait "$N8N_PID" || true
            fi
          }

          post() {
            local body="$1"
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/webhook/$DEDUP_WEBHOOK_PATH" \
              -H 'Content-Type: application/json' --data "$body")
            test "$code" = '200'
          }

          audit() {
            npx --yes n8n@2.42.6 execute --id=nexia-exp-auto-001-datatable-audit --rawOutput | tee "$AUDIT_OUTPUT"
            grep -Eq '"pass"[[:space:]]*:[[:space:]]*true' "$AUDIT_OUTPUT"
            grep -Eq '"rows"[[:space:]]*:[[:space:]]*2' "$AUDIT_OUTPUT"
            grep -Eq '"persistence"[[:space:]]*:[[:space:]]*"n8n-data-table"' "$AUDIT_OUTPUT"
          }

          trap 'stop_n8n || true' EXIT
          start_n8n

          post '{"event_id":"p1","email":"Persist@Test.Example"}'
          sleep 1
          post '{"event_id":"p1","email":"persist@test.example"}'
          sleep 1
          post '{"event_id":"p2","email":"PERSIST@test.example"}'
          sleep 1
          post '{"event_id":"p3","phone":"+34 600 999 111"}'
          sleep 1
          post '{"event_id":"p4","phone":"+34 600 999 111"}'
          sleep 2

          stop_n8n
          audit

          start_n8n
          post '{"event_id":"p5","email":"persist@test.example"}'
          sleep 2
          stop_n8n
          audit

          echo 'PASS: PERSISTENT_DEDUP_IDEMPOTENCY verified with native n8n Data Tables across separate webhook executions and process restart'
